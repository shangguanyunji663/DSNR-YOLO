# =============================================================================
# DSNR-YOLO 网络结构定义 —— 论文图 1 的复现（对照表见 docs/03、docs/05）
# =============================================================================
# yaml 每一行的格式：[from, repeats, module, args]
#   from    : 输入来自哪一层。-1 表示上一层；数字表示第几层；列表表示多路输入
#   repeats : 该模块重复几次（会被 depth_multiple 缩放）
#   module  : 模块类名（由 dsnr_yolo/custom_parse.py 的注册表解析）
#   args    : 模块参数；第一个通常是输出通道数（会被 width_multiple 缩放）
#
# 与 YOLOv11s 的四处不同（论文的四大改进）：
#   ① 主干第 2/4/6/8 层：C3k2 → DSNRblock   （轻量化 + 注意力 + 残差）
#   ② 主干第 3/5/7 层：Conv(下采样) → GhostConv（进一步减参数）
#   ③ 颈部：标准 PAN → BiFPN 双向加权融合（强化多尺度/小目标）
#   ④ 颈部下采样同样换成 GhostConv；损失函数换成自适应混合损失（见 losses/）
# =============================================================================

nc: 20            # 类别数：DIOR 有 20 类（训练时会被数据集 yaml 的 nc 覆盖）
depth_multiple: 0.5   # 深度系数：s 版缩放（C3k2/C2PSA 的重复次数 ×0.5）
width_multiple: 0.5   # 宽度系数：s 版缩放（所有通道数 ×0.5）
max_channels: 1024    # 通道数上限
dsnr: true            # 标记：训练器看到它会把模型换成带混合损失的 DSNRDetectionModel

# ---------------------------------------------------------------
# 主干 Backbone（0-10 层，对应论文图1左列"主干"）
# ---------------------------------------------------------------
backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0  P1/2   640→320
  - [-1, 1, Conv, [128, 3, 2]]        # 1  P2/4   320→160
  - [-1, 1, DSNRblock, [256]]         # 2  改进①：C3k2 → DSNRblock（64→128 通道）
  - [-1, 1, GhostConv, [256, 3, 2]]   # 3  P3/8   改进②：下采样 Conv → GhostConv（160→80）
  - [-1, 1, DSNRblock, [512]]         # 4  改进①（128→256 通道）—— P3 侧向特征
  - [-1, 1, GhostConv, [512, 3, 2]]   # 5  P4/16  改进②（80→40）
  - [-1, 1, DSNRblock, [512]]         # 6  改进①（256→256 通道）—— P4 侧向特征
  - [-1, 1, GhostConv, [1024, 3, 2]]  # 7  P5/32  改进②（40→20）
  - [-1, 1, DSNRblock, [1024]]        # 8  改进①（512→512 通道）
  - [-1, 1, SPPF, [1024, 5]]          # 9  空间金字塔快速池化（与 v11 相同）
  - [-1, 1, C2PSA, [1024]]            # 10 空间注意力模块（与 v11 相同）—— P5 侧向特征

# ---------------------------------------------------------------
# 颈部 Neck + 检测头 Head（11-26 层，对应论文图1中/右列"颈部网络""检测头"）
# BiFPN 设计要点（EfficientDet 规范）：
#   · 每层先经 1×1 Conv 对齐通道（P5=256, P4=256, P3=128），加权相加才有意义；
#   · 自顶向下（Upsample）与自底向上（GhostConv 下采样）两条路径；
#   · P4 输出节点融合三路输入（侧向 + 顶向下中间结果 + 下采样的 P3 输出）。
# ---------------------------------------------------------------
head:
  # ---- 三路侧向 1×1 卷积：对齐各尺度通道 ----
  - [10, 1, Conv, [512, 1, 1]]                      # 11 P5 侧向对齐（512→256, 20×20）
  - [6,  1, Conv, [512, 1, 1]]                      # 12 P4 侧向对齐（256→256, 40×40）
  - [4,  1, Conv, [256, 1, 1]]                      # 13 P3 侧向对齐（256→128, 80×80）

  # ---- 自顶向下路径（深层语义 → 浅层，帮助小目标获得语义）----
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]      # 14 P5 上采样 20×20→40×40
  - [[12, 14], 1, BiFPNFusion, []]                  # 15 BiFPN：P4 顶向下加权融合
  - [-1, 1, C3k2, [256, False, 0.25]]               # 16 融合后特征提炼（256→128）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 17 P4 上采样 40×40→80×80
  - [[13, 17], 1, BiFPNFusion, []]                  # 18 BiFPN：P3 加权融合 → P3 输出
  - [-1, 1, C3k2, [256, False, 0.25]]               # 19 P3 输出特征（小目标检测层）

  # ---- 自底向上路径（浅层定位 → 深层，帮助大目标获得细节）----
  - [-1, 1, GhostConv, [512, 3, 2]]                 # 20 P3 下采样 80×80→40×40（改进②）
  - [[12, 15, 20], 1, BiFPNFusion, []]              # 21 BiFPN：P4 输出节点（三路加权融合）
  - [-1, 1, C3k2, [512, False, 0.25]]               # 22 P4 输出特征（中目标检测层）
  - [-1, 1, GhostConv, [512, 3, 2]]                 # 23 P4 下采样 40×40→20×20（改进②）
  - [[11, 23], 1, BiFPNFusion, []]                  # 24 BiFPN：P5 输出节点（两路加权融合）
  - [-1, 1, C3k2, [1024, True]]                     # 25 P5 输出特征（大目标检测层）

  # ---- 检测头：P3/P4/P5 三个尺度一起预测（分别负责小/中/大目标）----
  - [[19, 22, 25], 1, Detect, [nc]]                 # 26 Detect(nc, reg_max, end2end, ch)
